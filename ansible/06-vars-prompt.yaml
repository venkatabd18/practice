- name: print the user info using prompt variables
  hosts: web
  vars_prompt:
    - name: username
      prompt: Please enter the username
      private: false

    - name: password
      prompt: pls eneter the password
      private: true

  tasks:
  - name: print the user info
    ansible.builtin.debug:
       msg: "Entered username is {{ username }} and password is {{ password }}"