- name: demo on command and shell modules
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: create the user
    command: useradd Venkat
    register: user_info
    
  - name: print the user info
    debug: 
      msg: "{{ user_info }}"

  - name: fetch the Venkat info from /etc/passwd
    command: cat /etc/passwd | grep Venkat
    register: details

  - name: print the details
    debug: 
      msg: "{{ details }}"