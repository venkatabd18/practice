- name: disbale the nodejs
  ansible.builtin.command: dnf module disable nodejs -y

- name: enable nodejs
  ansible.builtin.command: dnf module enable nodejs:24 -y

- name: install nodejs and mysql
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - mysql
    - nodejs
  
- name: create expense user
  ansible.builtin.user:
    name: expense

- name: execute the tasks from common tasks
  ansible.builtin.include_roles:
    name: common
    tasks_from: main.yaml

- name: Install Dependencies
  ansible.builtin.command: npm install
  args:
    chdir: "{{ app_location }}"

- name: copy the backend service
  ansible.builtin.templet:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service

- name: install PyMySQL
  ansible.builtin.pip:
    name: PyMySQL
    state: present
    executable: pip3.9

- name: load the database shema
  community.mysql.mysql_db:
    login_host: "{{ login_host }}"
    login_user: "{{ login_user }}"
    login_password: "{{ login_password }}"
    name: all
    state: import
    target: /app/schema/backend.sql

- name: start the service
  ansible.builtin.systemd_service:
    daemon_reload: true
    state: restarted
    name: backend

