- name: install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: start and enable the nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: execte the tasks from common tasks
  ansible.builtin.include_role:
    name: common
    tasks_from: main.yaml

- name: copy the expense conf 
  ansible.builtin.template:
    src: expense.conf.j2
    dest: /etc/nginx/default.d/expense.conf 
 
- name: restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted